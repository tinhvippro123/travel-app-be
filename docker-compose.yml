version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: travel_app_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: your_password
      POSTGRES_DB: travel_app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - travel_app_network

  redis:
    image: redis:7-alpine
    container_name: travel_app_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - travel_app_network

volumes:
  postgres_data:
  redis_data:

networks:
  travel_app_network:
    driver: bridge
